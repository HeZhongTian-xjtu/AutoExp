name: Linter

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: |
          python -m pip install ruff==0.7.1 black==24.3.0
      - name: Run Ruff
        run: ruff check --output-format=github autoexp/ scripts/
      - name: Run Black
        run: black --check --diff autoexp/ scripts/
